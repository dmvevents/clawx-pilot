name: Windows Smoke (build + install + probe)

# Autonomous runtime smoke for the MoE Windows build. Builds the .exe on a
# real windows-latest runner, silently installs it, launches the app
# headless, and probes the gateway + host-API + plugin-tool registration.
#
# What this CAN verify on a runner (no Outlook session, no GPU, no Chrome
# sign-in, no Ollama model download in the time budget):
#   - .exe builds and installs
#   - Electron + gateway boot to a healthy state
#   - Host API on 13210 challenges with 401 (auth wired)
#   - Gateway WS on 18789 accepts a TCP connect
#   - Plugin tools register (log scan: "outlook.open" etc.)
#   - openclaw.json doesn't get clobbered on first boot
#   - No app-update.yml leaks into install dir
#   - No "google-query-key" runtime-api enum errors in logs
#
# What this CANNOT verify: real Outlook, real Chrome session, real
# on-device LLM inference. Those need the pilot laptop or a UTM VM.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch/tag/SHA). Defaults to current ref.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install deps
        run: pnpm install

      - name: Download bundled Windows binaries (uv + node)
        run: pnpm run prep:win-binaries

      - name: Build Windows installer (no publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_PREINSTALLED_SKILLS: '1'
        run: pnpm run package:win

      - name: Locate installer
        id: locate
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter '*-win-x64.exe' | Select-Object -First 1
          if (-not $exe) { throw 'No win-x64 installer produced' }
          Write-Host "Installer: $($exe.FullName) size=$([math]::Round($exe.Length/1MB,1))MB"
          "installer=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Silent install
        shell: pwsh
        run: |
          # NSIS silent install, per-user (no admin)
          $p = Start-Process -FilePath '${{ steps.locate.outputs.installer }}' `
            -ArgumentList '/S','/CURRENTUSER' -Wait -PassThru -NoNewWindow
          Write-Host "Installer exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }

      - name: Verify install dir
        id: verify-install
        shell: pwsh
        run: |
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Ministry of Education",
            "$env:LOCALAPPDATA\Programs\ministry-of-education",
            "$env:LOCALAPPDATA\Programs\clawx",
            "$env:ProgramFiles\Ministry of Education",
            "${env:ProgramFiles(x86)}\Ministry of Education"
          )
          $dir = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $dir) {
            Write-Host '::error::Install dir not found in any candidate location'
            $candidates | ForEach-Object { Write-Host "  miss: $_" }
            throw 'Install dir missing'
          }
          Write-Host "Install dir: $dir"
          $exe = Get-ChildItem $dir -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'No .exe in install dir' }
          Write-Host "App exe: $($exe.FullName)"
          $resources = Join-Path $dir 'resources'
          $hasMoeExt = Test-Path (Join-Path $resources 'extensions\moe-principal-assistant')
          $hasGraphExt = Test-Path (Join-Path $resources 'extensions\microsoft-graph')
          $hasUpdateYml = Test-Path (Join-Path $resources 'app-update.yml')
          Write-Host "moe-principal-assistant ext: $hasMoeExt"
          Write-Host "microsoft-graph ext:         $hasGraphExt"
          Write-Host "app-update.yml present:      $hasUpdateYml (expected: False)"
          if (-not $hasMoeExt) { throw 'moe-principal-assistant missing' }
          if ($hasUpdateYml) { throw 'app-update.yml leaked — auto-update was supposed to be off' }
          "appExe=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "installDir=$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Launch app headless + probe
        id: probe
        shell: pwsh
        run: |
          # Strategy: launch the win-unpacked .exe via cmd /c with stdout
          # redirection from a fresh cmd context so stdio gets attached.
          # Electron GUI binaries detach Console subsystem under PowerShell
          # Start-Process; piping through cmd works around it.
          $exe = '${{ steps.verify-install.outputs.appExe }}'
          $unpackedDir = Get-ChildItem -Path release -Filter 'win-unpacked' -Directory | Select-Object -First 1
          if ($unpackedDir) {
            $unpackedExe = Join-Path $unpackedDir.FullName 'Ministry of Education.exe'
            if (Test-Path $unpackedExe) {
              Write-Host "Using win-unpacked exe (skips installer/SmartScreen): $unpackedExe"
              $exe = $unpackedExe
            }
          }
          $logDir = Join-Path $env:RUNNER_TEMP 'moe-smoke-logs'
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          $env:ELECTRON_ENABLE_LOGGING = '1'
          $env:ELECTRON_ENABLE_STACK_DUMPING = '1'
          $env:CLAWX_HEADLESS = '1'
          $env:CLAWX_NO_AUTO_UPDATE = '1'
          $env:CLAWX_SMOKE_TEST = '1'

          $stdoutLog = Join-Path $logDir 'app.stdout.log'
          $stderrLog = Join-Path $logDir 'app.stderr.log'

          # cmd-launch with redirection — captures Electron's main-process
          # console output even when the GUI subsystem detaches stdio under
          # PowerShell's Start-Process.
          $cmdLine = "`"$exe`" --no-sandbox --enable-logging=stderr --v=1 > `"$stdoutLog`" 2> `"$stderrLog`""
          Write-Host "cmd line: $cmdLine"
          $proc = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c', $cmdLine -PassThru -WindowStyle Hidden
          Write-Host "Launched cmd wrapper PID=$($proc.Id)"
          "appPid=$($proc.Id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $deadline = (Get-Date).AddSeconds(180)
          $gatewayUp = $false
          $hostApiUp = $false
          $procDiedAt = $null
          while ((Get-Date) -lt $deadline) {
            $alive = $false
            try {
              $p = Get-Process -Id $proc.Id -ErrorAction Stop
              $alive = $true
            } catch {
              $alive = $false
            }
            if (-not $alive -and -not $procDiedAt) {
              $procDiedAt = (Get-Date)
              Write-Host ("[!] app process exited at " + $procDiedAt.ToString('HH:mm:ss'))
            }

            if (-not $gatewayUp) {
              $t = Test-NetConnection -ComputerName 127.0.0.1 -Port 18789 -InformationLevel Quiet -WarningAction SilentlyContinue
              if ($t) { $gatewayUp = $true; Write-Host ("[+] gateway 18789 up at " + (Get-Date).ToString('HH:mm:ss')) }
            }
            if (-not $hostApiUp) {
              try {
                $r = Invoke-WebRequest -Uri 'http://127.0.0.1:13210/health' -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop
                if ($r.StatusCode -in 200,401,403) { $hostApiUp = $true; Write-Host ("[+] host-api 13210 status=" + $r.StatusCode) }
              } catch {
                $resp = $_.Exception.Response
                if ($resp -and ($resp.StatusCode.Value__ -in 401,403,404)) {
                  $hostApiUp = $true
                  Write-Host ("[+] host-api 13210 status=" + $resp.StatusCode.Value__)
                }
              }
            }
            if ($gatewayUp -and $hostApiUp) { break }
            if ($procDiedAt -and ((Get-Date) - $procDiedAt).TotalSeconds -gt 10) { break }
            Start-Sleep -Milliseconds 2000
          }

          # Snapshot ALL listening ports for forensic context
          Write-Host ''
          Write-Host '=== Listening ports ==='
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
            Where-Object { $_.LocalPort -lt 50000 -and $_.LocalAddress -in '127.0.0.1','0.0.0.0','::','::1' } |
            Select-Object LocalAddress, LocalPort, OwningProcess |
            Format-Table | Out-String | Write-Host

          # Dump the userData dir tree (find anything we created)
          $userDataCandidates = @(
            (Join-Path $env:APPDATA 'Ministry of Education'),
            (Join-Path $env:APPDATA 'ministry-of-education'),
            (Join-Path $env:APPDATA 'clawx'),
            (Join-Path $env:LOCALAPPDATA 'Ministry of Education'),
            (Join-Path $env:USERPROFILE '.openclaw'),
            (Join-Path $env:APPDATA '.openclaw')
          )
          $userData = $null
          foreach ($cand in $userDataCandidates) {
            if (Test-Path $cand) {
              if (-not $userData) { $userData = $cand }
              Write-Host ('Found userData candidate: ' + $cand)
              Get-ChildItem -Path $cand -Recurse -ErrorAction SilentlyContinue |
                Select-Object FullName, Length, LastWriteTime |
                Format-Table | Out-String | Write-Host
            }
          }
          if (-not $userData) { Write-Host '!! NO userData dir found in any candidate location' }

          if ($userData) {
            # Copy everything small enough (cap each file at 2 MB) into the artifact
            Get-ChildItem -Path $userData -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
              if ($_.Length -le 2MB) {
                $rel = $_.FullName.Substring($userData.Length).TrimStart('\','/').Replace('\','_')
                $target = Join-Path $logDir ('userData_' + $rel)
                Copy-Item $_.FullName -Destination $target -ErrorAction SilentlyContinue
              }
            }
          }

          # Windows Application Event Log entries for our exe (last 5 min)
          Write-Host ''
          Write-Host '=== Application Event Log (last 5 min, our exe) ==='
          try {
            Get-WinEvent -FilterHashtable @{
              LogName='Application'; StartTime=(Get-Date).AddMinutes(-5)
            } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'Ministry of Education' -or $_.ProviderName -eq 'Application Error' } |
              Select-Object -First 20 TimeCreated, ProviderName, Id, LevelDisplayName, Message |
              Format-List | Out-String | Write-Host
          } catch { Write-Host "(event log query failed: $_)" }

          # Stop the app for log capture
          try { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } catch {}
          Start-Sleep -Seconds 2

          # Scan logs for evidence
          $logBlob = ''
          $userDataLogs = @()
          if ($userData) {
            $userDataLogs = Get-ChildItem -Path $userData -Recurse -Filter '*.log' -ErrorAction SilentlyContinue
          }
          foreach ($l in $userDataLogs) {
            try { $logBlob += "`n=== $($l.FullName) ===`n" + (Get-Content $l.FullName -Raw -ErrorAction SilentlyContinue) } catch {}
          }
          $stdoutTxt = ''
          if (Test-Path $stdoutLog) { $stdoutTxt = Get-Content $stdoutLog -Raw }
          $stderrTxt = ''
          if (Test-Path $stderrLog) { $stderrTxt = Get-Content $stderrLog -Raw }
          $blob = "$logBlob`n$stdoutTxt`n$stderrTxt"

          Write-Host ''
          Write-Host '=== app.stdout.log (head 100 lines) ==='
          if ($stdoutTxt) { ($stdoutTxt -split "`n" | Select-Object -First 100) -join "`n" | Write-Host } else { Write-Host '(empty)' }
          Write-Host ''
          Write-Host '=== app.stderr.log (head 100 lines) ==='
          if ($stderrTxt) { ($stderrTxt -split "`n" | Select-Object -First 100) -join "`n" | Write-Host } else { Write-Host '(empty)' }
          Write-Host ''
          Write-Host ('=== userData log files: ' + $userDataLogs.Count + ' ===')
          foreach ($l in $userDataLogs) { Write-Host ('  ' + $l.FullName + ' (' + $l.Length + ' bytes)') }

          $outlookToolsHit = ([regex]::Matches($blob, 'outlook\.(open|read_inbox|search_inbox|read_email|draft_email|send_email|reply|forward|mark_read|list_attachments|download_attachment)')).Count
          $badEnumHit = ($blob -match 'google-query-key.*Invalid option' -or $blob -match 'Config validation failed.*api.*Invalid')
          $clobberHit = ($blob -match 'clobber|refusing to overwrite populated agents')

          Write-Host "outlook.* tool mentions in logs: $outlookToolsHit"
          Write-Host "bad-enum hit: $badEnumHit"
          Write-Host "clobber-guard fired: $clobberHit"

          $report = [ordered]@{
            installerPath = '${{ steps.locate.outputs.installer }}'
            installDir    = '${{ steps.verify-install.outputs.installDir }}'
            appExe        = $exe
            gatewayUp     = $gatewayUp
            hostApiUp     = $hostApiUp
            outlookToolsHit = $outlookToolsHit
            badEnumHit    = $badEnumHit
            clobberHit    = $clobberHit
            stdoutBytes   = (Get-Item $stdoutLog -ErrorAction SilentlyContinue).Length
            stderrBytes   = (Get-Item $stderrLog -ErrorAction SilentlyContinue).Length
          }
          $report | ConvertTo-Json -Depth 4 | Tee-Object -FilePath (Join-Path $logDir 'smoke-report.json') | Write-Host

          # Verified across runs 26367958140 / 26368301156 / 26368719550:
          # GitHub-hosted windows-latest runners cannot complete GUI Electron
          # boot. Process stays alive but app.whenReady() never fires (no
          # userData, no stdout, no stderr, no ports). Session 0 / non-
          # interactive desktop session blocks Chromium init. This is not
          # a build problem — it's a runner-environment limitation.
          #
          # Headless probes are reported as warnings, not failures, so the
          # rest of the smoke (build + install + verify) still gives us
          # decisive Windows packaging signal. Real runtime verification
          # needs a Windows VM or the pilot laptop.
          $passes = @()
          $warns = @()
          if ($gatewayUp) { $passes += 'gateway-port' } else { $warns += 'gateway-port (runner limitation)' }
          if ($hostApiUp) { $passes += 'host-api' } else { $warns += 'host-api (runner limitation)' }
          if ($outlookToolsHit -gt 0) { $passes += 'outlook-tools-registered' } else { $warns += 'outlook-tools-registered (runner limitation)' }
          if (-not $badEnumHit) { $passes += 'no-bad-enum' } else { $warns += 'no-bad-enum (FAILED — investigate)' }

          Write-Host ''
          Write-Host '=== SMOKE RESULT ==='
          Write-Host ('PASS: ' + ($passes -join ', '))
          Write-Host ('WARN: ' + ($warns -join ', '))
          # Only fail on bad-enum hit (which is a real regression we can detect
          # without runtime). All other warns are runner limitations.
          if ($badEnumHit) { throw 'Smoke failed: google-query-key enum bug detected in build artefacts' }
          Write-Host ''
          Write-Host '(headless probes are best-effort; runner Session 0 blocks GUI Electron boot)'

      - name: Upload installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-x64
          path: release/*-win-x64.exe
          if-no-files-found: warn
          retention-days: 7

      - name: Upload smoke logs + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: ${{ runner.temp }}/moe-smoke-logs/**
          if-no-files-found: warn
          retention-days: 7
