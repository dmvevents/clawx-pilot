model_list:
  - model_name: moe-demo
    litellm_params:
      model: vertex_ai/gemini-2.5-flash
      vertex_project: gen-lang-client-0649986230
      vertex_location: us-central1
  - model_name: moe-demo-pro
    litellm_params:
      model: vertex_ai/gemini-2.5-pro
      vertex_project: gen-lang-client-0649986230
      vertex_location: us-central1

litellm_settings:
  callbacks:
    - arize_phoenix
  drop_params: true
  set_verbose: false
  # Privacy default for Phoenix/OpenTelemetry: keep message bodies out of
  # traces unless a controlled demo explicitly opts into content capture.
  turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
